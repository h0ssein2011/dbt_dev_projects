models:
  - name: stg_js__customers
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
            
  - name: stg_js__orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_js__customers')
              field: customer_id

      - name: store_id
        data_tests:
          - not_null